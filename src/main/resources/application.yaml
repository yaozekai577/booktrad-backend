spring:
  application:
    name: booktrad
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/booktrading?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# 文件上传路径配置
file:
  upload:
    path: src/main/resources/upload

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

# 阿里云OSS配置
oss:
  # OSS服务端点，例如：oss-cn-hangzhou.aliyuncs.com
  endpoint: oss-cn-hangzhou.aliyuncs.com
  # 阿里云访问密钥ID
  access-key-id: __REMOVED_OSS_ACCESS_KEY_ID__
  # 阿里云访问密钥Secret
  access-key-secret: __REMOVED_OSS_ACCESS_KEY_SECRET__
  # OSS存储空间名称
  bucket-name: web-yzk
  # OSS存储空间所在区域
  region: oss-cn-hangzhou
  # 上传文件的前缀路径
  #prefix: booktrad/
  # 访问URL前缀
  #url-prefix: https://your-bucket-name.oss-cn-hangzhou.aliyuncs.com/

# AI功能配置
ai:
  # 阿里云通义千问配置
  dashscope:
    api-key: __REMOVED_DASHSCOPE_API_KEY__
    model: qwen-turbo  # 使用turbo模型，速度快且便宜
    timeout: 30  # 超时时间（秒）
  
  # Google Books API配置（可选，不需要密钥也能用）
  google-books:
    api-url: https://www.googleapis.com/books/v1/volumes
    api-key: ${GOOGLE_BOOKS_API_KEY:}  # 可选，有密钥可以提高限额
